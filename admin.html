<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergo — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#0e0e12;
    --surface:#17171d;
    --surface-2:#1f1f27;
    --paper:#f4f2ed;
    --coral:#ff4d6d;
    --indigo:#3d5aff;
    --gold:#e8b94d;
    --line: rgba(244,242,237,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--ink);color:var(--paper);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
  }
  .logo{font-family:'Bebas Neue', sans-serif;font-size:1.8rem;}
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 5vw;border-bottom:1px solid var(--line);
  }
  #logoutBtn{
    font-family:'JetBrains Mono', monospace;font-size:0.75rem;
    border:1px solid var(--line);padding:8px 16px;border-radius:100px;
    background:none;color:var(--paper);cursor:pointer;
  }
  #logoutBtn:hover{border-color:var(--paper);}

  /* LOGIN */
  #loginScreen{
    min-height:90vh;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .login-box{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:40px;max-width:380px;width:100%;
  }
  .login-box h1{font-family:'Bebas Neue', sans-serif;font-size:2.2rem;margin-bottom:6px;}
  .login-box p{color:rgba(244,242,237,0.6);font-size:0.9rem;margin-bottom:24px;}
  label{
    font-family:'JetBrains Mono', monospace;font-size:0.72rem;
    letter-spacing:0.05em;text-transform:uppercase;color:rgba(244,242,237,0.6);
    display:block;margin-bottom:6px;margin-top:16px;
  }
  input, textarea, select{
    width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;color:var(--paper);font-family:'Space Grotesk', sans-serif;font-size:0.95rem;
  }
  input:focus, textarea:focus, select:focus{outline:2px solid var(--indigo);outline-offset:1px;}
  textarea{resize:vertical;min-height:80px;}
  button.primary{
    margin-top:24px;width:100%;
    background:var(--paper);color:var(--ink);border:none;border-radius:100px;
    padding:14px;font-family:'JetBrains Mono', monospace;font-size:0.85rem;
    cursor:pointer;transition:all .25s ease;
  }
  button.primary:hover{background:var(--coral);color:var(--paper);}
  button.primary:disabled{opacity:0.5;cursor:not-allowed;}
  .msg{margin-top:14px;font-size:0.85rem;font-family:'JetBrains Mono', monospace;min-height:18px;}

  /* DASHBOARD */
  #dashboard{display:none;padding:40px 5vw;max-width:900px;margin:0 auto;}
  .section-title{font-family:'Bebas Neue', sans-serif;font-size:2rem;margin-bottom:20px;}
  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:32px;margin-bottom:40px;
  }
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.row{grid-template-columns:1fr;}}

  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th, td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:0.88rem;}
  th{font-family:'JetBrains Mono', monospace;font-size:0.7rem;text-transform:uppercase;color:rgba(244,242,237,0.5);}
  .badge{
    font-family:'JetBrains Mono', monospace;font-size:0.68rem;
    padding:3px 10px;border-radius:100px;display:inline-block;
  }
  .badge.active{background:rgba(232,185,77,0.15);color:var(--gold);}
  .badge.draft{background:rgba(244,242,237,0.1);color:rgba(244,242,237,0.6);}
  .badge.expired{background:rgba(255,77,109,0.15);color:var(--coral);}

  .delete-btn{
    font-family:'JetBrains Mono', monospace;font-size:0.72rem;
    border:1px solid rgba(255,77,109,0.4);color:var(--coral);
    background:none;padding:6px 14px;border-radius:100px;cursor:pointer;
    transition:all .2s ease;
  }
  .delete-btn:hover{background:var(--coral);color:var(--paper);border-color:var(--coral);}
  .delete-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .edit-btn{
    font-family:'JetBrains Mono', monospace;font-size:0.72rem;
    border:1px solid var(--line);color:var(--paper);
    background:none;padding:6px 14px;border-radius:100px;cursor:pointer;
    transition:all .2s ease;
  }
  .edit-btn:hover{border-color:var(--paper);}

  .file-input-wrap{
    border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;
    font-size:0.85rem;color:rgba(244,242,237,0.6);cursor:pointer;
  }
  .file-input-wrap:hover{border-color:var(--paper);}
</style>
</head>
<body>

<header>
  <div class="logo">EMERGO / admin</div>
  <button id="logoutBtn" style="display:none;">Esci</button>
</header>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>Accedi</h1>
    <p>Pannello riservato alla gestione dei brand.</p>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="tuamail@esempio.it">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
    <button class="primary" id="loginBtn">Entra</button>
    <p class="msg" id="loginMsg"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

  <div class="panel">
    <div class="section-title" id="brandFormTitle">Nuovo brand</div>
    <div class="row">
      <div>
        <label>Nome brand</label>
        <input type="text" id="brandName" placeholder="es. Nero Studio">
      </div>
      <div>
        <label>Città</label>
        <input type="text" id="brandCity" placeholder="es. Milano">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Categoria</label>
        <input type="text" id="brandCategory" placeholder="es. Streetwear">
      </div>
      <div>
        <label>Stato</label>
        <select id="brandStatus">
          <option value="draft">Bozza (non visibile)</option>
          <option value="active">Attivo (visibile sul sito)</option>
        </select>
      </div>
    </div>
    <label>Storia / descrizione breve</label>
    <textarea id="brandStory" placeholder="Chi sono, cosa fanno, cosa li rende diversi..."></textarea>
    <div class="row">
      <div>
        <label>Link shop</label>
        <input type="url" id="brandShop" placeholder="https://...">
      </div>
      <div>
        <label>Link Instagram</label>
        <input type="url" id="brandInstagram" placeholder="https://instagram.com/...">
      </div>
    </div>
    <label>Logo brand (mostrato nella card in vetrina)</label>
    <p id="currentLogoNote" style="display:none;font-size:0.8rem;color:rgba(244,242,237,0.5);margin-bottom:8px;">Logo attuale caricato — seleziona un file solo se vuoi sostituirlo.</p>
    <div class="file-input-wrap" id="logoFileWrap">
      <input type="file" id="brandLogo" accept="image/*" style="width:auto;border:none;">
    </div>
    <div style="display:flex;gap:12px;align-items:center;">
      <button class="primary" id="saveBrandBtn" style="flex:1;">Salva brand</button>
      <button id="cancelEditBtn" style="display:none;background:none;border:1px solid var(--line);color:var(--paper);border-radius:100px;padding:14px 22px;font-family:'JetBrains Mono', monospace;font-size:0.8rem;cursor:pointer;white-space:nowrap;">Annulla</button>
    </div>
    <p class="msg" id="brandMsg"></p>
  </div>

  <div class="panel">
    <div class="section-title">Nuovo prodotto</div>
    <label>Brand</label>
    <select id="productBrand"></select>
    <div class="row">
      <div>
        <label>Nome prodotto</label>
        <input type="text" id="productName" placeholder="es. Giacca oversize">
      </div>
      <div>
        <label>Prezzo (€)</label>
        <input type="number" step="0.01" id="productPrice" placeholder="es. 89.00">
      </div>
    </div>
    <label>Descrizione</label>
    <textarea id="productDescription" placeholder="Materiali, dettagli, taglie..."></textarea>
    <label>Foto prodotto</label>
    <div class="file-input-wrap" id="fileWrap">
      <input type="file" id="productImage" accept="image/*" style="width:auto;border:none;">
    </div>
    <button class="primary" id="saveProductBtn">Salva prodotto</button>
    <p class="msg" id="productMsg"></p>
  </div>

  <div class="panel">
    <div class="section-title">I tuoi brand</div>
    <table id="brandsTable">
      <thead>
        <tr><th>Logo</th><th>Nome</th><th>Città</th><th>Stato</th><th>Azioni</th></tr>
      </thead>
      <tbody id="brandsTableBody"></tbody>
    </table>
  </div>

  <div class="panel">
    <div class="section-title">I tuoi prodotti</div>
    <table id="productsTable">
      <thead>
        <tr><th>Foto</th><th>Nome</th><th>Brand</th><th>Prezzo</th><th>Azioni</th></tr>
      </thead>
      <tbody id="productsTableBody"></tbody>
    </table>
  </div>

</div>

<script>
  const SUPABASE_URL = 'https://wuvtvcxneilbcfxauzeq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_u5W20O0Amb-qANK5bYppSg_O_zvIecL';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  const logoutBtn = document.getElementById('logoutBtn');

  function slugify(text){
    return text.toString().toLowerCase().trim()
      .replace(/[^\w\s-]/g, '')
      .replace(/[\s_-]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  const STORAGE_BUCKET = 'brand-images';

  // Estrae il path interno al bucket da un public URL di Supabase Storage
  function storagePathFromUrl(url){
    if(!url) return null;
    const marker = `/object/public/${STORAGE_BUCKET}/`;
    const idx = url.indexOf(marker);
    if(idx === -1) return null;
    return decodeURIComponent(url.slice(idx + marker.length));
  }

  async function removeStorageFiles(urls){
    const paths = urls.map(storagePathFromUrl).filter(Boolean);
    if(paths.length === 0) return;
    const { error } = await supabaseClient.storage.from(STORAGE_BUCKET).remove(paths);
    if(error) console.warn('Pulizia storage non riuscita per alcuni file:', error.message);
  }

  // ---------- LOGIN ----------
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const msg = document.getElementById('loginMsg');
    msg.style.color = 'rgba(244,242,237,0.6)';
    msg.textContent = 'Accesso in corso...';

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){
      msg.style.color = 'var(--coral)';
      msg.textContent = 'Credenziali non valide.';
    } else {
      msg.textContent = '';
      showDashboard();
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    location.reload();
  });

  async function checkSession(){
    const { data } = await supabaseClient.auth.getSession();
    if(data.session){
      showDashboard();
    }
  }

  function showDashboard(){
    loginScreen.style.display = 'none';
    dashboard.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
    loadBrands();
    loadProducts();
  }

  // ---------- STATO MODIFICA BRAND ----------
  let editingBrandId = null;
  let editingBrandSlug = null;
  let editingBrandLogoUrl = null;

  const brandFormTitle = document.getElementById('brandFormTitle');
  const currentLogoNote = document.getElementById('currentLogoNote');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const saveBrandBtn = document.getElementById('saveBrandBtn');

  function enterEditMode(brand){
    editingBrandId = brand.id;
    editingBrandSlug = brand.slug;
    editingBrandLogoUrl = brand.logo_url || null;

    document.getElementById('brandName').value = brand.name || '';
    document.getElementById('brandCity').value = brand.city || '';
    document.getElementById('brandCategory').value = brand.category || '';
    document.getElementById('brandStatus').value = brand.status || 'draft';
    document.getElementById('brandStory').value = brand.story || '';
    document.getElementById('brandShop').value = brand.shop_url || '';
    document.getElementById('brandInstagram').value = brand.instagram_url || '';
    document.getElementById('brandLogo').value = '';

    brandFormTitle.textContent = `Modifica brand — ${brand.name}`;
    saveBrandBtn.textContent = 'Aggiorna brand';
    cancelEditBtn.style.display = 'inline-block';
    currentLogoNote.style.display = brand.logo_url ? 'block' : 'none';

    document.getElementById('brandName').closest('.panel').scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function exitEditMode(){
    editingBrandId = null;
    editingBrandSlug = null;
    editingBrandLogoUrl = null;

    ['brandName','brandCity','brandCategory','brandStory','brandShop','brandInstagram'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('brandStatus').value = 'draft';
    document.getElementById('brandLogo').value = '';

    brandFormTitle.textContent = 'Nuovo brand';
    saveBrandBtn.textContent = 'Salva brand';
    cancelEditBtn.style.display = 'none';
    currentLogoNote.style.display = 'none';
  }

  cancelEditBtn.addEventListener('click', exitEditMode);

  // ---------- SALVA / AGGIORNA BRAND ----------
  document.getElementById('saveBrandBtn').addEventListener('click', async () => {
    const name = document.getElementById('brandName').value.trim();
    const city = document.getElementById('brandCity').value.trim();
    const category = document.getElementById('brandCategory').value.trim();
    const status = document.getElementById('brandStatus').value;
    const story = document.getElementById('brandStory').value.trim();
    const shop_url = document.getElementById('brandShop').value.trim();
    const instagram_url = document.getElementById('brandInstagram').value.trim();
    const logoInput = document.getElementById('brandLogo');
    const msg = document.getElementById('brandMsg');

    if(!name){
      msg.style.color = 'var(--coral)';
      msg.textContent = 'Il nome del brand è obbligatorio.';
      return;
    }

    msg.style.color = 'rgba(244,242,237,0.6)';
    msg.textContent = 'Salvataggio...';

    const isEditing = !!editingBrandId;
    const slugForUpload = isEditing ? editingBrandSlug : (slugify(name) + '-' + Math.random().toString(36).slice(2,6));

    try {
      let logo_url = undefined; // undefined = non toccare il campo in update mode

      if(logoInput.files.length > 0){
        const file = logoInput.files[0];
        const path = `logos/${slugForUpload}-${Date.now()}-${file.name}`;
        const { error: uploadError } = await supabaseClient.storage.from('brand-images').upload(path, file);
        if(uploadError) throw uploadError;
        const { data: urlData } = supabaseClient.storage.from('brand-images').getPublicUrl(path);
        logo_url = urlData.publicUrl;

        // Se stavamo sostituendo un logo esistente, elimina il vecchio file
        if(isEditing && editingBrandLogoUrl){
          await removeStorageFiles([editingBrandLogoUrl]);
        }
      }

      if(isEditing){
        const payload = { name, city, category, status, story, shop_url, instagram_url };
        if(logo_url !== undefined) payload.logo_url = logo_url;

        const { error } = await supabaseClient.from('brands').update(payload).eq('id', editingBrandId);
        if(error) throw error;

        msg.style.color = 'var(--gold)';
        msg.textContent = 'Brand aggiornato!';
        exitEditMode();
      } else {
        const { error } = await supabaseClient.from('brands').insert({
          name, city, category, status, story, shop_url, instagram_url, slug: slugForUpload, logo_url: logo_url || null
        });
        if(error) throw error;

        msg.style.color = 'var(--gold)';
        msg.textContent = 'Brand salvato!';
        ['brandName','brandCity','brandCategory','brandStory','brandShop','brandInstagram'].forEach(id => document.getElementById(id).value = '');
        logoInput.value = '';
      }

      loadBrands();
    } catch(err){
      msg.style.color = 'var(--coral)';
      msg.textContent = 'Errore: ' + err.message;
    }
  });

  // ---------- CARICA BRAND (tabella + select prodotti) ----------
  async function loadBrands(){
    const { data, error } = await supabaseClient.from('brands').select('*').order('created_at', { ascending: false });
    if(error) return;

    const tbody = document.getElementById('brandsTableBody');
    tbody.innerHTML = '';
    const select = document.getElementById('productBrand');
    select.innerHTML = '';

    data.forEach(brand => {
      const tr = document.createElement('tr');
      const logoCell = brand.logo_url
        ? `<img src="${brand.logo_url}" alt="${brand.name}" style="width:36px;height:36px;object-fit:contain;border-radius:8px;background:var(--ink);padding:4px;">`
        : '—';
      tr.innerHTML = `<td>${logoCell}</td><td>${brand.name}</td><td>${brand.city || '—'}</td><td><span class="badge ${brand.status}">${brand.status}</span></td><td style="display:flex;gap:8px;"><button class="edit-btn" data-brand='${JSON.stringify(brand).replace(/'/g,"&apos;")}'>Modifica</button><button class="delete-btn" data-id="${brand.id}" data-name="${brand.name.replace(/"/g,'&quot;')}">Elimina</button></td>`;
      tbody.appendChild(tr);

      const opt = document.createElement('option');
      opt.value = brand.id;
      opt.textContent = brand.name;
      select.appendChild(opt);
    });
  }

  // ---------- MODIFICA / ELIMINA BRAND ----------
  document.getElementById('brandsTableBody').addEventListener('click', async (e) => {
    const editBtn = e.target.closest('.edit-btn');
    if(editBtn){
      const brand = JSON.parse(editBtn.dataset.brand.replace(/&apos;/g, "'"));
      enterEditMode(brand);
      return;
    }

    const btn = e.target.closest('.delete-btn');
    if(!btn) return;

    const id = btn.dataset.id;
    const name = btn.dataset.name;

    if(!confirm(`Eliminare "${name}"? Verranno eliminati anche tutti i suoi prodotti e i relativi file (logo, foto). L'azione non è reversibile.`)){
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Elimino...';

    try {
      // Recupera logo e foto prodotti da rimuovere dallo storage prima di cancellare le righe
      const { data: brandRow } = await supabaseClient.from('brands').select('logo_url').eq('id', id).single();
      const { data: productRows } = await supabaseClient.from('products').select('image_url').eq('brand_id', id);

      const urlsToRemove = [];
      if(brandRow && brandRow.logo_url) urlsToRemove.push(brandRow.logo_url);
      if(productRows) productRows.forEach(p => { if(p.image_url) urlsToRemove.push(p.image_url); });

      await removeStorageFiles(urlsToRemove);

      const { error } = await supabaseClient.from('brands').delete().eq('id', id);
      if(error) throw error;

      if(editingBrandId === id) exitEditMode();

      loadBrands();
      loadProducts();
    } catch(err){
      alert('Errore durante l\'eliminazione: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Elimina';
    }
  });

  // ---------- SALVA PRODOTTO ----------
  document.getElementById('saveProductBtn').addEventListener('click', async () => {
    const brand_id = document.getElementById('productBrand').value;
    const name = document.getElementById('productName').value.trim();
    const price = document.getElementById('productPrice').value;
    const description = document.getElementById('productDescription').value.trim();
    const fileInput = document.getElementById('productImage');
    const msg = document.getElementById('productMsg');

    if(!brand_id || !name){
      msg.style.color = 'var(--coral)';
      msg.textContent = 'Seleziona un brand e inserisci il nome del prodotto.';
      return;
    }

    msg.style.color = 'rgba(244,242,237,0.6)';
    msg.textContent = 'Salvataggio...';

    let image_url = null;

    try {
      if(fileInput.files.length > 0){
        const file = fileInput.files[0];
        const path = `${brand_id}/${Date.now()}-${file.name}`;
        const { error: uploadError } = await supabaseClient.storage.from('brand-images').upload(path, file);
        if(uploadError) throw uploadError;
        const { data: urlData } = supabaseClient.storage.from('brand-images').getPublicUrl(path);
        image_url = urlData.publicUrl;
      }

      const { error } = await supabaseClient.from('products').insert({
        brand_id, name, price: price || null, description, image_url
      });
      if(error) throw error;

      msg.style.color = 'var(--gold)';
      msg.textContent = 'Prodotto salvato!';
      ['productName','productPrice','productDescription'].forEach(id => document.getElementById(id).value = '');
      fileInput.value = '';
      loadProducts();
    } catch(err){
      msg.style.color = 'var(--coral)';
      msg.textContent = 'Errore: ' + err.message;
    }
  });

  // ---------- CARICA PRODOTTI ----------
  async function loadProducts(){
    const { data, error } = await supabaseClient
      .from('products')
      .select('id, name, price, image_url, brands(name)')
      .order('created_at', { ascending: false });
    if(error) return;

    const tbody = document.getElementById('productsTableBody');
    tbody.innerHTML = '';

    data.forEach(product => {
      const tr = document.createElement('tr');
      const photoCell = product.image_url
        ? `<img src="${product.image_url}" alt="${product.name}" style="width:36px;height:36px;object-fit:cover;border-radius:8px;">`
        : '—';
      const price = product.price !== null && product.price !== undefined ? '€ ' + Number(product.price).toFixed(2) : '—';
      const brandName = product.brands ? product.brands.name : '—';
      tr.innerHTML = `<td>${photoCell}</td><td>${product.name}</td><td>${brandName}</td><td>${price}</td><td><button class="delete-btn" data-id="${product.id}" data-name="${product.name.replace(/"/g,'&quot;')}" data-image="${product.image_url || ''}">Elimina</button></td>`;
      tbody.appendChild(tr);
    });
  }

  // ---------- ELIMINA PRODOTTO ----------
  document.getElementById('productsTableBody').addEventListener('click', async (e) => {
    const btn = e.target.closest('.delete-btn');
    if(!btn) return;

    const id = btn.dataset.id;
    const name = btn.dataset.name;
    const image = btn.dataset.image;

    if(!confirm(`Eliminare il prodotto "${name}"? La foto verrà rimossa definitivamente. L'azione non è reversibile.`)){
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Elimino...';

    try {
      if(image) await removeStorageFiles([image]);

      const { error } = await supabaseClient.from('products').delete().eq('id', id);
      if(error) throw error;

      loadProducts();
    } catch(err){
      alert('Errore durante l\'eliminazione: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Elimina';
    }
  });

  checkSession();
</script>

</body>
</html>
